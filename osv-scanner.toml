# osv-scanner ignore-list for uv.lock vulnerability scanning (`make audit` + CI audit job).
#
# Remaining advisories are all in transitive dependencies pinned by the FROZEN
# `forecasting-tools==0.2.54`: litellm (exact-pinned 1.80.0) and cryptography
# (capped <45.0.5 via asknews). The fixed versions are unreachable without
# upgrading forecasting-tools, which is deliberately frozen for behavioral
# stability. See FUTURE.md "Dependency CVEs gated by the frozen forecasting-tools pin".
#
# pillow and transformers advisories were cleared 2026-07-19 via
# `[tool.uv] override-dependencies` in pyproject.toml (pillow forced to >=12.3.0;
# transformers excluded from resolution entirely as a declared-but-unused dep).
# pydantic-settings was cleared by an in-range bump to 2.14.2.
#
# The scan stays LIVE for any NEW CVE not listed here — only these enumerated,
# accepted advisories are suppressed. Re-evaluate this whole list whenever
# forecasting-tools is upgraded (re-run `make audit` and prune resolved IDs).
#
# review-by: 2026-09-19  (re-audit this list quarterly or at the next
#            forecasting-tools bump, whichever comes first)

# Note: PYSEC-2026-35/-36 (cryptography) are aliases of GHSA IDs already listed
