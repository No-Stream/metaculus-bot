repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        # Safe fixes only: under the expanded rule set, unsafe fixes can change
        # behavior (SIM108 rewrites, RUF005 concat) and belong in reviewed edits.
        args: [--fix]
      - id: ruff-format
  # NOTE: a local `basedpyright` hook is added back once the codebase is
  # type-clean (Phase 4); enforcing it now would block all commits.

  # The full suite, gated on push rather than commit: ~105s is too much friction
  # per commit (agents commit often) but is the right price per push, which is
  # where a red run first becomes a reviewer's problem. Same command CI runs, so
  # a local pass and a CI pass cannot diverge on invocation. Needs
  # `pre-commit install --hook-type pre-push` (done by `make precommit_install`).
  - repo: local
    hooks:
      - id: pytest-full-suite
        name: pytest (full suite, same command as CI)
        entry: uv run --frozen pytest --cov=metaculus_bot
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # `main` is ruleset-protected on GitHub (PR required, `lint` + `test` must
      # pass), but nothing stopped a local commit landing on `main` directly —
      # which then cannot be pushed at all, so the work has to be replayed onto a
      # branch afterwards. This refuses at commit time instead, on the branch the
      # commit would land on. Belt to the ruleset's braces: the ruleset protects
      # the remote, this protects the local history that feeds it.
      # `stages` is pinned rather than left to default: an entry with no `stages`
      # inherits `default_stages`, which is EVERY stage, so the guard would also fire
      # on push and print a "commit refused" message at a push it isn't guarding.
      - id: no-commit-to-main
        name: refuse a commit on main (branch first)
        entry: scripts/hooks/no_commit_to_main.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # GitHub's "block command line pushes that expose my email" only guards emails
      # registered on the pushing account — a stray identity inherited from a global
      # gitconfig (the usual way a wrong email reaches a public repo) is invisible to
      # it. This guard travels with the repo: wherever it is cloned, commits must
      # carry a pseudonymous noreply identity. `stages` pinned for the same reason
      # as above.
      - id: require-noreply-email
        name: require a GitHub noreply commit identity
        entry: scripts/hooks/require_noreply_email.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true