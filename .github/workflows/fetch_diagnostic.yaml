name: Fetch egress diagnostic (free, no API keys)

# Measures WHY the Tier-1 resolution-source fetcher gets HTTP 403 from
# Akamai-fronted federal hosts (bls.gov, cdc.gov, fsis.usda.gov) only when the bot
# runs here, while the identical client gets 200 from the operator's laptop and EC2
# box. Per URL it runs the bot's own aiohttp client, the same GET under curl_cffi
# Chrome impersonation, and the Wayback copy, then prints one table plus a verdict.
# A row where the plain rung is 403 and the impersonated rung is 200 says the
# runner's TLS fingerprint is being scored (fixable client-side); a row where both
# are 403 says the runner's egress IP is blocked (not fixable client-side).
on:
  workflow_dispatch:

# Two concurrent runs would double the request rate at every host below, which the
# script's per-host pacing cannot see across processes.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch_diagnostic:
    runs-on: ubuntu-latest
    # Sized off the local run (~1 min for 30 sequential requests at 25s timeouts and
    # 1s per-host spacing). The worst case is every request timing out, which is
    # 30 x 25s = 12.5 min, so the per-step cap below is the real bound and this is
    # the backstop.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: astral-sh/setup-uv@v7
        timeout-minutes: 5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        timeout-minutes: 10
        run: uv sync --frozen --no-dev
      - name: Probe egress and fetch rungs
        timeout-minutes: 15
        # NO SECRET IS PASSED TO THIS JOB, deliberately: per the repo's cost gate
        # (CLAUDE.md), every credit spend goes through the operator, so a diagnostic
        # that anyone may dispatch must be structurally incapable of spending. With
        # no METACULUS_TOKEN, no OpenRouter key and no provider key in the
        # environment, this job cannot call an LLM, cannot reach a paid research
        # provider and cannot publish to Metaculus even if the code changed under
        # it. The only env var here controls stdout buffering.
        #
        # curl_cffi arrives via `--with` rather than as a declared dependency: it is
        # only needed by this probe (it reaches the venv transitively through
        # yfinance today, which is not something the diagnostic should rely on), and
        # adding it to pyproject would put a prod dependency on a debugging tool.
        #
        # The script prints the runner's egress IP first (api.ipify.org), since the
        # IP is what the both-403 verdict is about. Nothing is uploaded: the table in
        # this step's log IS the artifact.
        env:
          PYTHONUNBUFFERED: '1'
        run: uv run --frozen --no-dev --with curl_cffi python scripts/probes/fetch_diagnostic.py
